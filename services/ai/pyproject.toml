[project]
name = "legal-aid-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "groq>=0.13.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "scikit-learn>=1.4.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "joblib>=1.3.0",
  "xgboost>=2.0.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

