<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" fill="none" preserveAspectRatio="xMidYMax meet">
  <defs>
    <!-- Soft horizontal fade to seamlessly blend into the dark left background -->
    <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="25%" stop-color="white" stop-opacity="0.4" />
      <stop offset="60%" stop-color="white" stop-opacity="0.85" />
      <stop offset="100%" stop-color="white" stop-opacity="1" />
    </linearGradient>

    <!-- Subtle vertical bottom fade -->
    <linearGradient id="verticalFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="1" />
      <stop offset="80%" stop-color="white" stop-opacity="0.9" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <mask id="cityMask">
      <rect width="1000" height="800" fill="url(#fadeMask)" />
    </mask>

    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g mask="url(#cityMask)" opacity="0.85">
    <!-- ================= BACKGROUND TALL TOWERS (THIN FAINT OUTLINES) ================= -->
    <g stroke="#f1eee6" stroke-opacity="0.2" stroke-width="1">
      <!-- Far Left High-Rise -->
      <rect x="180" y="240" width="110" height="560" />
      <line x1="180" y1="300" x2="290" y2="300" />
      <line x1="180" y1="360" x2="290" y2="360" />
      <line x1="180" y1="420" x2="290" y2="420" />
      <line x1="180" y1="480" x2="290" y2="480" />

      <!-- Center-Left Spire Tower -->
      <rect x="330" y="140" width="130" height="660" />
      <line x1="395" y1="60" x2="395" y2="140" stroke-width="1.5" stroke-opacity="0.4" />
      <circle cx="395" cy="58" r="3" fill="#d7ff52" fill-opacity="0.8" filter="url(#accentGlow)" />
      
      <!-- Window grid ticks -->
      <line x1="350" y1="200" x2="440" y2="200" stroke-dasharray="4 6" />
      <line x1="350" y1="260" x2="440" y2="260" stroke-dasharray="4 6" />
      <line x1="350" y1="320" x2="440" y2="320" stroke-dasharray="4 6" />
      <line x1="350" y1="380" x2="440" y2="380" stroke-dasharray="4 6" />
      <line x1="350" y1="440" x2="440" y2="440" stroke-dasharray="4 6" />

      <!-- Far Right Tower -->
      <rect x="760" y="160" width="150" height="640" />
      <line x1="835" y1="90" x2="835" y2="160" stroke-width="1.5" stroke-opacity="0.4" />
      <circle cx="835" cy="88" r="3" fill="#d7ff52" fill-opacity="0.8" filter="url(#accentGlow)" />
      <line x1="760" y1="230" x2="910" y2="230" />
      <line x1="760" y1="310" x2="910" y2="310" />
      <line x1="760" y1="390" x2="910" y2="390" />
    </g>

    <!-- ================= MIDGROUND PRIMARY SKYSCRAPERS ================= -->
    <g stroke="#f1eee6" stroke-opacity="0.5" stroke-width="1.5" fill="#101412" fill-opacity="0.3">
      <!-- Tower 1: Stepped Modern Tower (Left) -->
      <polygon points="260,320 370,320 370,800 260,800" />
      <polygon points="280,270 350,270 350,320 280,320" />
      <line x1="315" y1="210" x2="315" y2="270" stroke-width="2" stroke="#d7ff52" stroke-opacity="0.8" />
      <circle cx="315" cy="206" r="3.5" fill="#d7ff52" filter="url(#accentGlow)" />
      
      <!-- Architectural vertical mullions -->
      <line x1="295" y1="320" x2="295" y2="800" stroke-opacity="0.25" />
      <line x1="335" y1="320" x2="335" y2="800" stroke-opacity="0.25" />
      
      <!-- Floor lines -->
      <line x1="260" y1="380" x2="370" y2="380" stroke-opacity="0.3" />
      <line x1="260" y1="450" x2="370" y2="450" stroke-opacity="0.3" />
      <line x1="260" y1="520" x2="370" y2="520" stroke-opacity="0.3" />
      <line x1="260" y1="600" x2="370" y2="600" stroke-opacity="0.3" />

      <!-- Tower 2: Tall Central Landmark Tower (Angular/Diagonal Crown) -->
      <polygon points="490,180 570,120 650,180 650,800 490,800" />
      <line x1="570" y1="40" x2="570" y2="120" stroke-width="2.5" stroke="#f1eee6" />
      <circle cx="570" cy="38" r="4.5" fill="#d7ff52" filter="url(#accentGlow)" />

      <!-- Diagonal Structural Bracing / Trusses (Signature Minimal Architecture) -->
      <line x1="490" y1="180" x2="650" y2="340" stroke-opacity="0.25" stroke-dasharray="3 3" />
      <line x1="650" y1="180" x2="490" y2="340" stroke-opacity="0.25" stroke-dasharray="3 3" />
      <line x1="490" y1="340" x2="650" y2="500" stroke-opacity="0.25" stroke-dasharray="3 3" />
      <line x1="650" y1="340" x2="490" y2="500" stroke-opacity="0.25" stroke-dasharray="3 3" />
      <line x1="490" y1="500" x2="650" y2="660" stroke-opacity="0.25" stroke-dasharray="3 3" />
      <line x1="650" y1="500" x2="490" y2="660" stroke-opacity="0.25" stroke-dasharray="3 3" />
      
      <!-- Central vertical axis -->
      <line x1="570" y1="120" x2="570" y2="800" stroke="#d7ff52" stroke-opacity="0.35" stroke-width="1.5" />

      <!-- Tower 3: Corporate Diagonal Cut Pavilion (Right) -->
      <polygon points="690,260 820,200 820,800 690,800" />
      <line x1="720" y1="260" x2="720" y2="800" stroke-opacity="0.25" />
      <line x1="755" y1="260" x2="755" y2="800" stroke-opacity="0.25" />
      <line x1="790" y1="260" x2="790" y2="800" stroke-opacity="0.25" />
      
      <line x1="690" y1="330" x2="820" y2="330" stroke-opacity="0.3" />
      <line x1="690" y1="410" x2="820" y2="410" stroke-opacity="0.3" />
      <line x1="690" y1="490" x2="820" y2="490" stroke-opacity="0.3" />
      <line x1="690" y1="580" x2="820" y2="580" stroke-opacity="0.3" />

      <!-- Tower 4: Sleek Glass Monolith (Far Right) -->
      <polygon points="850,290 960,290 960,800 850,800" />
      <polygon points="870,260 940,260 940,290 870,290" />
      <line x1="905" y1="220" x2="905" y2="260" stroke-width="1.5" />
      <circle cx="905" cy="217" r="3" fill="#d7ff52" filter="url(#accentGlow)" />
      
      <line x1="850" y1="360" x2="960" y2="360" stroke-opacity="0.3" />
      <line x1="850" y1="440" x2="960" y2="440" stroke-opacity="0.3" />
      <line x1="850" y1="530" x2="960" y2="530" stroke-opacity="0.3" />
    </g>

    <!-- ================= FOREGROUND ACCENT LINES & PERSPECTIVE GRID ================= -->
    <g stroke="#d7ff52" stroke-opacity="0.3" stroke-width="1">
      <!-- Subtle ground baseline -->
      <line x1="150" y1="740" x2="980" y2="740" stroke-width="1.5" stroke-opacity="0.4" />
      <line x1="300" y1="760" x2="980" y2="760" stroke-dasharray="5 5" stroke-opacity="0.2" />
    </g>
  </g>
</svg>
